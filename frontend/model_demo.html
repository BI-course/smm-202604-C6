<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model Demos</title>
<style>
  :root {
    --accent: #4f46e5; --accent-dark: #4338ca; --bg: #f3f4f6; --card: #ffffff;
    --text: #1f2937; --muted: #6b7280; --border: #e5e7eb;
    --ok-bg: #eef2ff; --err-bg: #fef2f2; --err-text: #b91c1c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 12px; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { max-width: 760px; margin: 0 auto; background: var(--card); border-radius: 12px;
          padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: .9rem; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .tabs button { flex: 1 1 140px; padding: 10px; border: 1px solid var(--border); background: #fff;
                 border-radius: 8px; cursor: pointer; font-size: .9rem; }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: 4px; }
  input, select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px;
                  font-size: .95rem; }
  input.invalid, select.invalid { border-color: var(--err-text); background: var(--err-bg); }
  .submit { margin-top: 16px; width: 100%; padding: 12px; border: 0; border-radius: 8px;
            background: var(--accent); color: #fff; font-size: 1rem; cursor: pointer; }
  .submit:hover { background: var(--accent-dark); }
  .submit:disabled { opacity: .6; cursor: wait; }
  .result { display: none; margin-top: 16px; padding: 14px; border-radius: 8px; white-space: pre-line; }
  .result.show { display: block; }
  .result.ok { background: var(--ok-bg); }
  .result.err { background: var(--err-bg); color: var(--err-text); }
  .figure { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }
  .hint { color: var(--muted); font-size: .8rem; margin-top: 4px; }
  .bar { height: 8px; background: var(--accent); border-radius: 4px; margin: 2px 0 8px; }
</style>
</head>
<body>
<div class="card">
  <h1>Model Demos</h1>
  <p class="sub">Each tab calls one endpoint of our Flask API.</p>
  <div class="tabs" id="tabs"></div>
  <form id="form" novalidate></form>
  <div id="result" class="result"></div>
</div>

<script>
  // ---------------------------------------------------------------------
  // 1. WHERE IS THE API?  Change this ONE line.
  //    Local test : "http://127.0.0.1:5000"
  //    Deployed   : "https://<your-service>.onrender.com"   (no trailing slash)
  // ---------------------------------------------------------------------
  const API_BASE = "https://labproj-smm-202604-c6.onrender.com";

  // ---------------------------------------------------------------------
  // 2. ONE ENTRY PER MODEL: the route, the form fields and how to show the
  //    answer. A field's "id" MUST equal the JSON key the API expects.
  // ---------------------------------------------------------------------
  const MODELS = [
    {
      name: "Revenue Regressor",
      route: "/api/v1/models/retail-revenue-regressor/predictions",
      fields: [
        { id: "store_format", label: "Store format", type: "select", options: ["Convenience", "Hypermarket", "Kiosk", "Supermarket"], value: "Supermarket" },
        { id: "location_type", label: "Location type", type: "select", options: ["CBD", "Mall", "Residential", "Street"], value: "Mall" },
        { id: "delivery_available", label: "Delivery available", type: "select", options: ["Yes", "No"], value: "Yes" },
        { id: "store_size_category", label: "Store size category", type: "select", options: ["Small", "Medium", "Large"], value: "Medium" },
        { id: "store_age_years", label: "Store age (years)", type: "number", step: "0.1", min: 0, value: 0.5 },
        { id: "store_size_sqm", label: "Store size (sqm)", type: "number", min: 1, value: 250 },
        { id: "promotions_active", label: "Active promotions", type: "number", step: "1", min: 0, value: 2 },
        { id: "footfall_count", label: "Daily footfall", type: "number", min: 0, value: 450 },
        { id: "online_order_count", label: "Online orders", type: "number", min: 0, value: 28 },
        { id: "avg_basket_size_kes", label: "Average basket (KES)", type: "number", min: 0, value: 950 },
      ],
      render: (box, d) => show(box, "Predicted daily revenue",
                               "KES " + Number(d.predicted_daily_revenue_kes).toLocaleString(), d.model),
    },
    {
      name: "Distress Classifier",
      route: "/api/v1/models/corporate-financial-distress-classifier/predictions",
      fields: [
        { id: "industry_sector", label: "Industry sector", type: "select", options: ["Construction", "Energy", "Manufacturing", "Retail", "Technology"], value: "Manufacturing" },
        { id: "listing_status", label: "Listing status", type: "select", options: ["Private", "Public"], value: "Private" },
        { id: "credit_rating_band", label: "Credit rating band", type: "select", options: ["High Risk", "Speculative", "Investment Grade"], value: "Speculative" },
        { id: "audit_going_concern_flag", label: "Going-concern flag", type: "select", options: ["No", "Not Applicable", "Yes"], value: "No" },
        { id: "years_in_operation", label: "Years in operation", type: "number", min: 0, value: 15 },
        { id: "num_employees", label: "Employees", type: "number", step: "1", min: 0, value: 300 },
        { id: "debt_to_equity_ratio", label: "Debt-to-equity", type: "number", step: "0.01", value: 1.5 },
        { id: "current_ratio", label: "Current ratio", type: "number", step: "0.01", value: 1.4 },
        { id: "interest_coverage_ratio", label: "Interest coverage", type: "number", step: "0.01", value: 3.0 },
        { id: "revenue_growth_pct", label: "Revenue growth (%)", type: "number", step: "0.1", value: 5 },
        { id: "net_profit_margin_pct", label: "Net profit margin (%)", type: "number", step: "0.1", value: 6 },
        { id: "working_capital_to_assets_ratio", label: "Working capital / assets", type: "number", step: "0.01", value: 0.15 },
        { id: "macroeconomic_interest_rate_pct", label: "Macro interest rate (%)", type: "number", step: "0.1", value: 10 },
      ],
      render: (box, d) => {
        show(box, "Predicted distress risk", d.predicted_distress_risk_category, d.model);
        for (const [label, p] of Object.entries(d.class_probabilities)) {
          box.append(text("div", `${label}: ${(p * 100).toFixed(1)}%`));
          const bar = document.createElement("div");
          bar.className = "bar"; bar.style.width = (p * 100) + "%";
          box.append(bar);
        }
      },
    },
    {
      name: "Customer Segmenter",
      route: "/api/v1/models/customer-segmentation/predict",
      fields: [
        { id: "recency_days", label: "Days since last purchase", type: "number", step: "any", min: 0, value: 20 },
        { id: "frequency_per_year", label: "Purchases per year", type: "number", step: "any", min: 0, value: 20 },
        { id: "avg_order_value_kes", label: "Average order value (KES)", type: "number", step: "any", min: 0, value: 9000 },
        { id: "num_categories_purchased", label: "Categories purchased", type: "number", step: "1", min: 0, value: 6 },
      ],
      render: (box, d) => show(box, "Predicted segment", `Segment ${d.cluster}: ${d.segment_name}`, d.model),
    },
    {
      name: "Show Recommender",
      route: "/api/v1/models/content-recommender/recommendations",
      fields: [
        { id: "watched_items", label: "Show IDs already watched (comma-separated)", type: "text", value: "S04" },
        { id: "top_n", label: "How many recommendations?", type: "number", step: "1", min: 1, max: 10, value: 3 },
      ],
      // Turn "S01, S03" into ["S01", "S03"] before sending.
      build: (p) => ({ watched_items: p.watched_items.split(",").map(s => s.trim()).filter(Boolean), top_n: p.top_n }),
      render: (box, d) => {
        show(box, "Recommendations after watching " + d.watched_items.join(", "), "", d.model);
        if (!d.recommendations.length) { box.append(text("div", d.message)); return; }
        for (const r of d.recommendations) {
          box.append(text("div", `${r.item_name} (${r.show_id}) \u2014 confidence ${(r.confidence * 100).toFixed(1)}%, lift ${Number(r.lift).toFixed(2)}`));
        }
      },
    },
  ];

  // ---------------------------------------------------------------------
  // 3. Small helpers. We build the result with textContent (never innerHTML)
  //    so nothing coming back from the server can inject HTML into the page.
  // ---------------------------------------------------------------------
  function text(tag, content) {
    const el = document.createElement(tag);
    el.textContent = content;
    return el;
  }
  function show(box, title, big, footer) {
    box.replaceChildren(text("div", title));
    if (big) { const f = text("div", big); f.className = "figure"; box.append(f); }
    if (footer) { const h = text("div", "Model: " + footer); h.className = "hint"; box.append(h); }
  }
  function showError(message) {
    const box = document.getElementById("result");
    box.className = "result show err";
    box.textContent = message;
  }

  // ---------------------------------------------------------------------
  // 4. Build the tabs and the form for the selected model.
  // ---------------------------------------------------------------------
  let current = 0;
  const form = document.getElementById("form");
  const resultBox = document.getElementById("result");

  function selectTab(index) {
    current = index;
    resultBox.className = "result";
    document.querySelectorAll("#tabs button").forEach((b, i) => b.classList.toggle("active", i === index));
    const model = MODELS[index];
    form.replaceChildren();
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const f of model.fields) {
      const wrap = document.createElement("div");
      const label = text("label", f.label);
      label.htmlFor = f.id;
      let input;
      if (f.type === "select") {
        input = document.createElement("select");
        for (const o of f.options) input.append(new Option(o, o));
      } else {
        input = document.createElement("input");
        input.type = f.type;
        for (const k of ["step", "min", "max"]) if (f[k] !== undefined) input.setAttribute(k, f[k]);
      }
      input.id = f.id;
      input.value = f.value;
      wrap.append(label, input);
      grid.append(wrap);
    }
    const btn = text("button", "Predict");
    btn.type = "submit"; btn.className = "submit"; btn.id = "submitBtn";
    form.append(grid, btn);
  }

  const tabs = document.getElementById("tabs");
  MODELS.forEach((m, i) => {
    const b = text("button", m.name);
    b.type = "button";
    b.addEventListener("click", () => selectTab(i));
    tabs.append(b);
  });

  // ---------------------------------------------------------------------
  // 5. Validate -> send -> show the answer or a friendly error.
  // ---------------------------------------------------------------------
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const model = MODELS[current];
    resultBox.className = "result";

    // (a) Missing-input check: every field must be filled in.
    const payload = {};
    const missing = [];
    for (const f of model.fields) {
      const el = document.getElementById(f.id);
      el.classList.remove("invalid");
      const raw = el.value.trim();
      if (raw === "") { el.classList.add("invalid"); missing.push(f.label); continue; }
      payload[f.id] = f.type === "number" ? Number(raw) : raw;
    }
    if (missing.length) {
      showError("Please fill in: " + missing.join(", "));
      return;
    }

    const body = model.build ? model.build(payload) : payload;
    if (body.watched_items && body.watched_items.length === 0) { showError("Please enter at least one show ID."); return; }

    // (b) Send the request. A free Render service can take about a minute to
    //     wake up, so we wait up to 90 seconds before giving up.
    const btn = document.getElementById("submitBtn");
    btn.disabled = true; btn.textContent = "Predicting...";
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 90000);
    try {
      const response = await fetch(API_BASE + model.route, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        signal: controller.signal,
      });
      let data = null;
      try { data = await response.json(); } catch (_) { /* not JSON */ }
      if (!response.ok) {
        // api.py sends errors as {"error": "..."}.
        throw new Error((data && data.error) || `Server responded with status ${response.status}`);
      }
      resultBox.className = "result show ok";
      model.render(resultBox, data);
    } catch (err) {
      showError(err.name === "AbortError"
        ? "The request timed out. If the API is on Render, it may be waking up - try again in a minute."
        : "Request failed: " + err.message + "  (Is the API running at " + API_BASE + " ?)");
    } finally {
      clearTimeout(timer);
      btn.disabled = false; btn.textContent = "Predict";
    }
  });

  selectTab(0);
</script>
</body>
</html>
